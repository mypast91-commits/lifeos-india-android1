<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08132e">
<title>LifeOS India</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#172033;
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:600px;
  margin:auto;
  min-height:100vh;
  background:#f4f7fb;
  padding-bottom:85px;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,#08132e,#123d91);
  color:white;
  padding:22px 18px 25px;
  border-radius:0 0 24px 24px;
}

.header h1{
  font-size:25px;
  margin-bottom:5px;
}

.header p{
  font-size:13px;
  opacity:.8;
}

/* CONTENT */
.content{
  padding:18px;
}

.hero{
  background:linear-gradient(135deg,#087df5,#1555df);
  color:white;
  padding:22px;
  border-radius:20px;
  margin-bottom:18px;
  box-shadow:0 8px 25px rgba(21,85,223,.18);
}

.hero h2{
  font-size:25px;
  margin-bottom:7px;
}

.hero p{
  font-size:14px;
  opacity:.9;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px 15px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
  border:1px solid #edf0f5;
  min-height:125px;
  transition:.15s;
}

.card:active{
  transform:scale(.97);
}

.card .icon{
  font-size:29px;
  margin-bottom:10px;
}

.card h3{
  font-size:16px;
  margin-bottom:5px;
}

.card p{
  color:#7c879b;
  font-size:13px;
}

/* SECTION */
.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:24px 0 12px;
}

.section-title h2{
  font-size:18px;
}

.link-btn{
  border:0;
  background:none;
  color:#1769e8;
  font-size:13px;
}

/* REMINDER */
.reminder{
  background:white;
  border-radius:16px;
  padding:15px;
  margin-bottom:10px;
  border-left:4px solid #1769e8;
  box-shadow:0 3px 12px rgba(0,0,0,.05);
}

.reminder-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.reminder-title{
  font-weight:bold;
  font-size:15px;
}

.reminder-date{
  color:#1769e8;
  font-size:12px;
  margin-top:6px;
}

.reminder-note{
  color:#7b8494;
  font-size:12px;
  margin-top:5px;
}

.delete-btn{
  border:0;
  background:#fff0f0;
  color:#e53935;
  width:32px;
  height:32px;
  border-radius:9px;
}

/* FORM */
.form-card{
  background:white;
  border-radius:20px;
  padding:18px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
  color:#354052;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid #dce2eb;
  border-radius:12px;
  padding:13px;
  outline:none;
  background:#fff;
  color:#172033;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#1769e8;
}

.field textarea{
  min-height:85px;
  resize:vertical;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:linear-gradient(135deg,#087df5,#1555df);
  color:white;
  font-weight:bold;
  font-size:15px;
}

.back-btn{
  border:0;
  background:white;
  padding:10px 14px;
  border-radius:10px;
  margin-bottom:14px;
  color:#1769e8;
}

/* EMPTY */
.empty{
  text-align:center;
  padding:35px 15px;
  color:#8993a5;
  background:white;
  border-radius:16px;
}

.empty .big{
  font-size:40px;
  margin-bottom:8px;
}

/* BOTTOM NAV */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:600px;
  height:70px;
  background:white;
  border-top:1px solid #e8ebf0;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-btn{
  border:0;
  background:none;
  color:#7e8798;
  font-size:11px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-btn .nav-icon{
  font-size:22px;
}

.nav-btn.active{
  color:#1769e8;
  font-weight:bold;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  background:#172033;
  color:white;
  padding:12px 17px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* HIDDEN */
.screen{
  display:none;
}

.screen.active{
  display:block;
}

@media(max-width:380px){
  .content{
    padding:14px;
  }

  .grid{
    gap:9px;
  }

  .card{
    padding:15px 12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <h1>LifeOS India</h1>
    <p>आपकी रोज़मर्रा की ज़िंदगी को आसान बनाएं</p>
  </header>

  <!-- HOME -->
  <main id="home" class="screen active">
    <div class="content">

      <div class="hero">
        <h2 id="greeting">नमस्ते 👋</h2>
        <p>आज के जरूरी काम और जानकारी एक जगह रखें।</p>
      </div>

      <div class="grid">

        <div class="card" onclick="showScreen('documents')">
          <div class="icon">📄</div>
          <h3>Documents</h3>
          <p><span id="documentCount">0</span> saved</p>
        </div>

        <div class="card" onclick="showScreen('bills')">
          <div class="icon">💳</div>
          <h3>Bills</h3>
          <p><span id="billCount">0</span> saved</p>
        </div>

        <div class="card" onclick="showScreen('vehicle')">
          <div class="icon">🚗</div>
          <h3>Vehicle</h3>
          <p><span id="vehicleCount">0</span> saved</p>
        </div>

        <div class="card" onclick="showScreen('family')">
          <div class="icon">👨‍👩‍👧</div>
          <h3>Family</h3>
          <p><span id="familyCount">0</span> saved</p>
        </div>

      </div>

      <div class="section-title">
        <h2>आज के Reminders</h2>
        <button class="link-btn" onclick="showScreen('reminders')">
          सभी देखें
        </button>
      </div>

      <div id="homeReminders"></div>

    </div>
  </main>


  <!-- REMINDERS -->
  <main id="reminders" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>मेरे Reminders</h2>
      </div>

      <div id="reminderList"></div>

    </div>
  </main>


  <!-- ADD REMINDER -->
  <main id="addReminder" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>नया Reminder</h2>
      </div>

      <div class="form-card">

        <form onsubmit="saveReminder(event)">

          <div class="field">
            <label>Reminder Title</label>
            <input
              id="remTitle"
              type="text"
              placeholder="जैसे Electricity Bill"
              required
            >
          </div>

          <div class="field">
            <label>Category</label>
            <select id="remCategory">
              <option value="General">General</option>
              <option value="Bill">Bill</option>
              <option value="Document">Document</option>
              <option value="Vehicle">Vehicle</option>
              <option value="Family">Family</option>
              <option value="Work">Work</option>
            </select>
          </div>

          <div class="field">
            <label>Date</label>
            <input
              id="remDate"
              type="date"
              required
            >
          </div>

          <div class="field">
            <label>Time</label>
            <input
              id="remTime"
              type="time"
              required
            >
          </div>

          <div class="field">
            <label>Note</label>
            <textarea
              id="remNote"
              placeholder="कोई अतिरिक्त जानकारी..."
            ></textarea>
          </div>

          <button class="save-btn" type="submit">
            🔔 Reminder Save करें
          </button>

        </form>

      </div>

    </div>
  </main>


  <!-- DOCUMENTS -->
  <main id="documents" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>📄 Documents</h2>
      </div>

      <div id="documentsList"></div>

      <button class="save-btn" onclick="addDocument()">
        + Document Add करें
      </button>

    </div>
  </main>


  <!-- BILLS -->
  <main id="bills" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>💳 Bills</h2>
      </div>

      <div id="billsList"></div>

      <button class="save-btn" onclick="addBill()">
        + Bill Add करें
      </button>

    </div>
  </main>


  <!-- VEHICLE -->
  <main id="vehicle" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>🚗 Vehicle</h2>
      </div>

      <div id="vehicleList"></div>

      <button class="save-btn" onclick="addVehicle()">
        + Vehicle Add करें
      </button>

    </div>
  </main>


  <!-- FAMILY -->
  <main id="family" class="screen">
    <div class="content">

      <button class="back-btn" onclick="showScreen('home')">
        ← वापस
      </button>

      <div class="section-title">
        <h2>👨‍👩‍👧 Family</h2>
      </div>

      <div id="familyList"></div>

      <button class="save-btn" onclick="addFamily()">
        + Family Member Add करें
      </button>

    </div>
  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      id="navHome"
      class="nav-btn active"
      onclick="showScreen('home')"
    >
      <span class="nav-icon">🏠</span>
      Home
    </button>

    <button
      id="navReminders"
      class="nav-btn"
      onclick="showScreen('reminders')"
    >
      <span class="nav-icon">🔔</span>
      Reminders
    </button>

    <button
      id="navAdd"
      class="nav-btn"
      onclick="showScreen('addReminder')"
    >
      <span class="nav-icon">➕</span>
      Add
    </button>

  </nav>

</div>

<div id="toast" class="toast"></div>


<!-- IMPORTANT:
     GitHub Actions build के समय यह file बनेगी -->
<script src="notifications.bundle.js"></script>


<script>

/* =========================
   STORAGE
========================= */

function getData(key, fallback){

  try{
    const data = localStorage.getItem(key);

    if(data){
      return JSON.parse(data);
    }

  }catch(error){
    console.error(error);
  }

  return fallback;
}


function setData(key, value){

  try{
    localStorage.setItem(
      key,
      JSON.stringify(value)
    );
  }catch(error){
    console.error(error);
  }

}


/* =========================
   DATA
========================= */

let reminders = getData(
  "lifeos_reminders",
  []
);

let documents = getData(
  "lifeos_documents",
  []
);

let bills = getData(
  "lifeos_bills",
  []
);

let vehicles = getData(
  "lifeos_vehicles",
  []
);

let family = getData(
  "lifeos_family",
  []
);


/* =========================
   GREETING
========================= */

function updateGreeting(){

  const hour = new Date().getHours();

  let text = "नमस्ते 👋";

  if(hour >= 5 && hour < 12){
    text = "Good Morning ☀️";
  }
  else if(hour >= 12 && hour < 17){
    text = "Good Afternoon 🌤️";
  }
  else if(hour >= 17 && hour < 21){
    text = "Good Evening 🌆";
  }
  else{
    text = "Good Night 🌙";
  }

  const el = document.getElementById("greeting");

  if(el){
    el.textContent = text;
  }

}


/* =========================
   SCREEN
========================= */

function showScreen(screen){

  document.querySelectorAll(".screen")
    .forEach(function(el){
      el.classList.remove("active");
    });

  const target =
    document.getElementById(screen);

  if(target){
    target.classList.add("active");
  }

  document.querySelectorAll(".nav-btn")
    .forEach(function(el){
      el.classList.remove("active");
    });

  if(screen === "home"){
    document.getElementById("navHome")
      .classList.add("active");
  }

  if(screen === "reminders"){
    document.getElementById("navReminders")
      .classList.add("active");
  }

  if(screen === "addReminder"){
    document.getElementById("navAdd")
      .classList.add("active");

    setDefaultReminderDateTime();
  }

  render();
}


/* =========================
   TOAST
========================= */

let toastTimer;

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function(){

    el.classList.remove("show");

  },2500);

}


/* =========================
   DATE / TIME
========================= */

function pad(num){
  return String(num).padStart(2,"0");
}


function setDefaultReminderDateTime(){

  const dateInput =
    document.getElementById("remDate");

  const timeInput =
    document.getElementById("remTime");

  if(!dateInput || !timeInput){
    return;
  }

  if(dateInput.value && timeInput.value){
    return;
  }

  const now = new Date();

  now.setMinutes(
    now.getMinutes() + 10
  );

  dateInput.value =
    now.getFullYear() +
    "-" +
    pad(now.getMonth()+1) +
    "-" +
    pad(now.getDate());

  timeInput.value =
    pad(now.getHours()) +
    ":" +
    pad(now.getMinutes());

}


/* =========================
   NOTIFICATION ID
========================= */

function createNotificationId(){

  /*
   Android notification IDs
   safe integer range में रखें।
  */

  return Math.floor(
    100000000 +
    Math.random() * 900000000
  );

}


/* =========================
   SAVE REMINDER
========================= */

async function saveReminder(event){

  event.preventDefault();

  const title =
    document.getElementById("remTitle")
      .value
      .trim();

  const category =
    document.getElementById("remCategory")
      .value;

  const date =
    document.getElementById("remDate")
      .value;

  const time =
    document.getElementById("remTime")
      .value;

  const note =
    document.getElementById("remNote")
      .value
      .trim();


  if(!title || !date || !time){

    toast("कृपया Title, Date और Time भरें");

    return;
  }


  /*
   YYYY-MM-DDTHH:MM
   Android/JavaScript local time
  */

  const dateTime =
    date + "T" + time;

  const when =
    new Date(dateTime);


  if(isNaN(when.getTime())){

    toast("Date/Time सही नहीं है");

    return;
  }


  if(when.getTime() <= Date.now()){

    toast("Future का Date और Time चुनें");

    return;
  }


  const notificationId =
    createNotificationId();


  const item = {

    id: String(Date.now()),

    notificationId:
      notificationId,

    title:
      title,

    category:
      category,

    date:
      date,

    time:
      time,

    datetime:
      dateTime,

    note:
      note

  };


  reminders.push(item);

  setData(
    "lifeos_reminders",
    reminders
  );


  /*
   Real phone notification schedule
  */

  let notificationResult = false;


  if(
    window.LifeOSNotifications &&
    typeof window.LifeOSNotifications.schedule === "function"
  ){

    notificationResult =
      await window.LifeOSNotifications.schedule(
        notificationId,
        title,
        note || "आपका LifeOS reminder है 🔔",
        dateTime
      );

  }


  /*
   Form reset
  */

  document.getElementById("remTitle")
    .value = "";

  document.getElementById("remDate")
    .value = "";

  document.getElementById("remTime")
    .value = "";

  document.getElementById("remNote")
    .value = "";


  if(notificationResult){

    toast("Reminder save हो गया 🔔 Notification set है");

  }else{

    toast("Reminder save हो गया ✅");

  }


  render();


  setTimeout(function(){

    showScreen("home");

  },800);

}


/* =========================
   DELETE REMINDER
========================= */

async function deleteReminder(id){

  const item =
    reminders.find(function(rem){

      return String(rem.id) === String(id);

    });


  if(
    item &&
    item.notificationId &&
    window.LifeOSNotifications &&
    typeof window.LifeOSNotifications.cancel === "function"
  ){

    await window.LifeOSNotifications.cancel(
      item.notificationId
    );

  }


  reminders =
    reminders.filter(function(rem){

      return String(rem.id) !== String(id);

    });


  setData(
    "lifeos_reminders",
    reminders
  );


  toast("Reminder delete हो गया");

  render();

}


/* =========================
   FORMAT DATE
========================= */

function formatDate(date){

  if(!date){
    return "";
  }

  const parts =
    date.split("-");

  if(parts.length !== 3){
    return date;
  }

  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =========================
   RENDER REMINDERS
========================= */

function reminderHTML(item){

  return `
    <div class="reminder">

      <div class="reminder-top">

        <div>

          <div class="reminder-title">
            ${escapeHTML(item.title)}
          </div>

          <div class="reminder-date">
            📅 ${formatDate(item.date)}
            &nbsp; ⏰ ${escapeHTML(item.time || "")}
          </div>

          ${
            item.note
            ?
            `<div class="reminder-note">
              ${escapeHTML(item.note)}
            </div>`
            :
            ""
          }

        </div>

        <button
          class="delete-btn"
          onclick="deleteReminder('${item.id}')"
        >
          🗑️
        </button>

      </div>

    </div>
  `;

}


function renderReminders(){

  const list =
    document.getElementById("reminderList");

  const homeList =
    document.getElementById("homeReminders");


  if(!reminders.length){

    const empty = `
      <div class="empty">
        <div class="big">🔔</div>
        <div>अभी कोई reminder नहीं है</div>
      </div>
    `;

    if(list){
      list.innerHTML = empty;
    }

    if(homeList){
      homeList.innerHTML = empty;
    }

    return;
  }


  const sorted =
    [...reminders].sort(function(a,b){

      return new Date(
        a.datetime || (a.date + "T" + (a.time || "00:00"))
      ) -
      new Date(
        b.datetime || (b.date + "T" + (b.time || "00:00"))
      );

    });


  if(list){

    list.innerHTML =
      sorted
      .map(reminderHTML)
      .join("");

  }


  if(homeList){

    homeList.innerHTML =
      sorted
      .slice(0,3)
      .map(reminderHTML)
      .join("");

  }

}


/* =========================
   DOCUMENTS
========================= */

function addDocument(){

  const name =
    prompt("Document का नाम लिखें:");

  if(!name){
    return;
  }

  documents.push({
    id:Date.now(),
    name:name
  });

  setData(
    "lifeos_documents",
    documents
  );

  toast("Document add हो गया");

  render();

}


function renderDocuments(){

  const list =
    document.getElementById("documentsList");

  if(!list){
    return;
  }

  if(!documents.length){

    list.innerHTML = `
      <div class="empty">
        <div class="big">📄</div>
        कोई document saved नहीं है
      </div>
    `;

    return;
  }


  list.innerHTML =
    documents.map(function(item){

      return `
        <div class="reminder">
          📄 ${escapeHTML(item.name)}
        </div>
      `;

    }).join("");

}


/* =========================
   BILLS
========================= */

function addBill(){

  const name =
    prompt("Bill का नाम लिखें:");

  if(!name){
    return;
  }

  bills.push({
    id:Date.now(),
    name:name
  });

  setData(
    "lifeos_bills",
    bills
  );

  toast("Bill add हो गया");

  render();

}


function renderBills(){

  const list =
    document.getElementById("billsList");

  if(!list){
    return;
  }

  if(!bills.length){

    list.innerHTML = `
      <div class="empty">
        <div class="big">💳</div>
        कोई bill saved नहीं है
      </div>
    `;

    return;
  }


  list.innerHTML =
    bills.map(function(item){

      return `
        <div class="reminder">
          💳 ${escapeHTML(item.name)}
        </div>
      `;

    }).join("");

}

/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

========================= */

  document.getElementById("familyCount")
    .textContent = family.length;


  renderReminders();

  renderDocuments();

  renderVehicles();

  renderFamily();

}

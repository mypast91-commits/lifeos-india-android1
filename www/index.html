<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08132e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LifeOS India</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,system-ui,sans-serif;
  background:#eef3f9;
  color:#101828;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

body{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#f7f9fc;
  padding-bottom:90px;
}

/* HEADER */
.top{
  background:linear-gradient(145deg,#08132e,#0d2c67);
  color:#fff;
  padding:24px 18px 26px;
  border-radius:0 0 28px 28px;
}

.brand{
  font-size:27px;
  font-weight:800;
}

.brand span{color:#ff9d00}

.tag{
  font-size:12px;
  color:#c8d5f5;
  margin-top:4px;
}

.hero{
  margin-top:20px;
  background:linear-gradient(120deg,#087df5,#1555df);
  border-radius:18px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}

.hero b{
  display:block;
  font-size:17px;
}

.hero small{
  display:block;
  margin-top:4px;
  opacity:.85;
}

.circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#fff;
  color:#1267e8;
  font-size:24px;
  display:grid;
  place-items:center;
}

/* CONTENT */
.content{padding:16px}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.card{
  background:#fff;
  border-radius:17px;
  padding:16px;
  box-shadow:0 5px 20px rgba(23,43,77,.07);
  transition:.15s;
}

.card:active{
  transform:scale(.98);
}

.icon{
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:22px;
  background:#eef5ff;
}

.count{
  float:right;
  font-weight:800;
  background:#e9f3ff;
  color:#1267e8;
  border-radius:20px;
  padding:3px 8px;
  font-size:12px;
}

.card h3{
  margin:12px 0 3px;
  font-size:15px;
}

.muted{
  color:#7b8799;
  font-size:12px;
}

.section{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:22px 2px 10px;
}

.section h2{
  font-size:18px;
  margin:0;
}

.link{
  color:#1671ed;
  font-size:13px;
  background:none;
}

/* REMINDER */
.rem{
  background:#fff;
  border-radius:15px;
  padding:13px;
  margin:8px 0;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 3px 14px rgba(23,43,77,.06);
}

.ri{
  width:40px;
  height:40px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:#edf5ff;
  flex-shrink:0;
}

.rem b{
  font-size:14px;
}

.rem small{
  display:block;
  color:#8b96a8;
  margin-top:3px;
}

.pay{
  margin-left:auto;
  background:#1671ed;
  color:#fff;
  border-radius:9px;
  padding:7px 12px;
  font-size:12px;
}

/* SCREENS */
.screen{
  display:none;
}

.screen.active{
  display:block;
}

.pagehead{
  display:flex;
  align-items:center;
  padding:18px 16px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:5;
}

.pagehead h1{
  font-size:20px;
  margin:0;
}

.back{
  background:none;
  font-size:28px;
  margin-right:8px;
  color:#101828;
}

.list{
  padding:16px;
}

.add{
  margin-left:auto;
  background:#116cf1;
  color:#fff;
  border-radius:12px;
  padding:9px 14px;
}

/* FORM */
.form{
  padding:16px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:13px;
  border:1px solid #dce3ed;
  border-radius:12px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:#1671ed;
}

.save{
  width:100%;
  padding:14px;
  background:#116cf1;
  color:#fff;
  border-radius:12px;
  font-weight:700;
}

/* ITEM */
.data-item{
  background:#fff;
  border-radius:15px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:0 3px 14px rgba(23,43,77,.06);
}

.data-item b{
  font-size:15px;
}

.data-item small{
  display:block;
  color:#7b8799;
  margin-top:5px;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#8b96a8;
}

.empty-icon{
  font-size:42px;
  margin-bottom:8px;
}

/* BOTTOM NAV */
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  height:72px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #e4e9f0;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:20;
}

.navbtn{
  background:none;
  color:#8b96a8;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  font-size:11px;
}

.navbtn span{
  font-size:22px;
}

.navbtn.active{
  color:#116cf1;
  font-weight:700;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%) translateY(20px);
  background:#101828;
  color:#fff;
  padding:11px 17px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */
@media(max-width:360px){
  .grid{
    gap:9px;
  }

  .card{
    padding:13px;
  }

  .brand{
    font-size:24px;
  }
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->
<section id="homeScreen" class="screen active">

  <header class="top">
    <div class="brand">LifeOS <span>India</span></div>
    <div class="tag">आपकी जिंदगी की जरूरी चीजें, एक जगह</div>

    <div class="hero">
      <div>
        <b id="heroTitle">Good Morning 👋</b>
        <small id="heroText">आज के जरूरी काम देखें</small>
      </div>
      <button class="circle" onclick="showScreen('addReminder')">+</button>
    </div>
  </header>

  <main class="content">

    <div class="grid">

      <button class="card" onclick="showScreen('documents')">
        <span class="count" id="docCount">0</span>
        <div class="icon">📄</div>
        <h3>Documents</h3>
        <div class="muted">जरूरी दस्तावेज</div>
      </button>

      <button class="card" onclick="showScreen('bills')">
        <span class="count" id="billCount">0</span>
        <div class="icon">💳</div>
        <h3>Bills</h3>
        <div class="muted">बिल और भुगतान</div>
      </button>

      <button class="card" onclick="showScreen('vehicle')">
        <span class="count" id="vehicleCount">0</span>
        <div class="icon">🚗</div>
        <h3>Vehicle</h3>
        <div class="muted">गाड़ी के कागज</div>
      </button>

      <button class="card" onclick="showScreen('family')">
        <span class="count" id="familyCount">0</span>
        <div class="icon">👨‍👩‍👧</div>
        <h3>Family</h3>
        <div class="muted">परिवार की जानकारी</div>
      </button>

    </div>

    <div class="section">
      <h2>आज के Reminders</h2>
      <button class="link" onclick="showScreen('reminders')">सभी देखें</button>
    </div>

    <div id="homeReminders"></div>

  </main>
</section>


<!-- REMINDERS -->
<section id="remindersScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>Reminders</h1>
    <button class="add" onclick="showScreen('addReminder')">+ Add</button>
  </div>

  <div class="list" id="allReminders"></div>

</section>


<!-- ADD REMINDER -->
<section id="addReminderScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>नया Reminder</h1>
  </div>

  <form class="form" onsubmit="saveReminder(event)">

    <div class="field">
      <label>Reminder का नाम</label>
      <input id="remTitle" type="text" placeholder="जैसे बिजली बिल" required>
    </div>

    <div class="field">
      <label>Category</label>
      <select id="remCategory">
        <option value="📌">General</option>
        <option value="💳">Bill</option>
        <option value="📄">Document</option>
        <option value="🚗">Vehicle</option>
        <option value="👨‍👩‍👧">Family</option>
      </select>
    </div>

    <div class="field">
      <label>Date</label>
      <input id="remDate" type="date" required>
    </div>

    <div class="field">
      <label>Note</label>
      <textarea id="remNote" rows="3" placeholder="कोई जरूरी जानकारी"></textarea>
    </div>

    <button class="save" type="submit">Reminder Save करें</button>

  </form>

</section>


<!-- DOCUMENTS -->
<section id="documentsScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>Documents</h1>
    <button class="add" onclick="addDocument()">+ Add</button>
  </div>

  <div class="list" id="documentsList"></div>

</section>


<!-- BILLS -->
<section id="billsScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>Bills</h1>
    <button class="add" onclick="addBill()">+ Add</button>
  </div>

  <div class="list" id="billsList"></div>

</section>


<!-- VEHICLE -->
<section id="vehicleScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>Vehicle</h1>
    <button class="add" onclick="addVehicle()">+ Add</button>
  </div>

  <div class="list" id="vehicleList"></div>

</section>


<!-- FAMILY -->
<section id="familyScreen" class="screen">

  <div class="pagehead">
    <button class="back" onclick="showScreen('home')">‹</button>
    <h1>Family</h1>
    <button class="add" onclick="addFamily()">+ Add</button>
  </div>

  <div class="list" id="familyList"></div>

</section>


<!-- BOTTOM NAV -->
<nav class="bottom">

  <button class="navbtn active" id="navHome" onclick="showScreen('home')">
    <span>⌂</span>
    Home
  </button>

  <button class="navbtn" id="navReminders" onclick="showScreen('reminders')">
    <span>⏰</span>
    Reminders
  </button>

  <button class="navbtn" id="navAdd" onclick="showScreen('addReminder')">
    <span>＋</span>
    Add
  </button>

</nav>

</div>

<div id="toast" class="toast"></div>


<script>
"use strict";

/* =========================
   STORAGE HELPERS
========================= */

function getData(key, fallback){
  try{
    const value = localStorage.getItem(key);

    if(value === null){
      return fallback;
    }

    return JSON.parse(value);

  }catch(error){
    console.error("Storage error:", error);
    return fallback;
  }
}

function setData(key, value){
  try{
    localStorage.setItem(key, JSON.stringify(value));
  }catch(error){
    console.error("Save error:", error);
  }
}


/* =========================
   DEFAULT DATA
========================= */

let reminders = getData("lifeos_reminders", []);

let documents = getData("lifeos_documents", []);

let bills = getData("lifeos_bills", []);

let vehicles = getData("lifeos_vehicles", []);

let family = getData("lifeos_family", []);


/* =========================
   SCREEN
========================= */

function showScreen(name){

  const screens = document.querySelectorAll(".screen");

  screens.forEach(function(screen){
    screen.classList.remove("active");
  });

  const target = document.getElementById(name + "Screen");

  if(target){
    target.classList.add("active");
  }

  const navButtons = document.querySelectorAll(".navbtn");

  navButtons.forEach(function(btn){
    btn.classList.remove("active");
  });

  if(name === "home"){
    document.getElementById("navHome").classList.add("active");
  }

  if(name === "reminders"){
    document.getElementById("navReminders").classList.add("active");
  }

  if(name === "addReminder"){
    document.getElementById("navAdd").classList.add("active");
  }

  window.scrollTo(0,0);

  render();
}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   DATE
========================= */

function formatDate(dateString){

  if(!dateString){
    return "";
  }

  try{

    const parts = dateString.split("-");

    if(parts.length !== 3){
      return dateString;
    }

    return parts[2] + "/" + parts[1] + "/" + parts[0];

  }catch(error){
    return dateString;
  }
}


/* =========================
   TOAST
========================= */

let toastTimer = null;

function toast(message){

  const box = document.getElementById("toast");

  if(!box){
    return;
  }

  box.textContent = message;
  box.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function(){
    box.classList.remove("show");
  },2200);
}


/* =========================
   REMINDER
========================= */

function reminderItem(item){

  return `
    <div class="rem">

      <div class="ri">
        ${escapeHTML(item.category || "📌")}
      </div>

      <div>
        <b>${escapeHTML(item.title)}</b>
        <small>
          ${escapeHTML(formatDate(item.date))}
          ${item.note ? " • " + escapeHTML(item.note) : ""}
        </small>
      </div>

      <button class="pay" onclick="deleteReminder('${escapeHTML(item.id)}')">
        Done
      </button>

    </div>
  `;
}


function saveReminder(event){

  event.preventDefault();

  const title = document.getElementById("remTitle").value.trim();
  const category = document.getElementById("remCategory").value;
  const date = document.getElementById("remDate").value;
  const note = document.getElementById("remNote").value.trim();

  if(!title || !date){
    toast("कृपया जरूरी जानकारी भरें");
    return;
  }

  const item = {
    id: String(Date.now()),
    title:title,
    category:category,
    date:date,
    note:note
  };

  reminders.push(item);

  setData("lifeos_reminders", reminders);

  document.getElementById("remTitle").value = "";
  document.getElementById("remDate").value = "";
  document.getElementById("remNote").value = "";

  toast("Reminder save हो गया ✅");

  render();

  setTimeout(function(){
    showScreen("home");
  },500);
}


function deleteReminder(id){

  reminders = reminders.filter(function(item){
    return String(item.id) !== String(id);
  });

  setData("lifeos_reminders", reminders);

  toast("Reminder complete ✅");

  render();
}


/* =========================
   DOCUMENTS
========================= */

function addDocument(){

  const name = prompt("Document का नाम लिखें:");

  if(!name){
    return;
  }

  documents.push({
    id:String(Date.now()),
    name:name
  });

  setData("lifeos_documents",documents);

  toast("Document add हो गया");

  render();
}


function renderDocuments(){

  const box = document.getElementById("documentsList");

  if(!documents.length){

    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">📄</div>
        अभी कोई document नहीं है
      </div>
    `;

    return;
  }

  box.innerHTML = documents.map(function(item){

    return `
      <div class="data-item">
        <b>📄 ${escapeHTML(item.name)}</b>
        <small>Document saved</small>
      </div>
    `;

  }).join("");
}


/* =========================
   BILLS
========================= */

function addBill(){

  const name = prompt("Bill का नाम लिखें:");

  if(!name){
    return;
  }

  bills.push({
    id:String(Date.now()),
    name:name
  });

  setData("lifeos_bills",bills);

  toast("Bill add हो गया");

  render();
}


function renderBills(){

  const box = document.getElementById("billsList");

  if(!bills.length){

    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">💳</div>
        अभी कोई bill नहीं है
      </div>
    `;

    return;
  }

  box.innerHTML = bills.map(function(item){

    return `
      <div class="data-item">
        <b>💳 ${escapeHTML(item.name)}</b>
        <small>Bill saved</small>
      </div>
    `;

  }).join("");
}


/* =========================
   VEHICLE
========================= */

function addVehicle(){

  const name = prompt("Vehicle का नाम लिखें:");

  if(!name){
    return;
  }

  vehicles.push({
    id:String(Date.now()),
    name:name
  });

  setData("lifeos_vehicles",vehicles);

  toast("Vehicle add हो गया");

  render();
}


function renderVehicles(){

  const box = document.getElementById("vehicleList");

  if(!vehicles.length){

    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">🚗</div>
        अभी कोई vehicle नहीं है
      </div>
    `;

    return;
  }

  box.innerHTML = vehicles.map(function(item){

    return `
      <div class="data-item">
        <b>🚗 ${escapeHTML(item.name)}</b>
        <small>Vehicle saved</small>
      </div>
    `;

  }).join("");
}


/* =========================
   FAMILY
========================= */

function addFamily(){

  const name = prompt("Family member का नाम लिखें:");

  if(!name){
    return;
  }

  family.push({
    id:String(Date.now()),
    name:name
  });

  setData("lifeos_family",family);

  toast("Family member add हो गया");

  render();
}


function renderFamily(){

  const box = document.getElementById("familyList");

  if(!family.length){

    box.innerHTML = `
      <div class="empty">
        <div class="empty-icon">👨‍👩‍👧</div>
        अभी कोई family member नहीं है
      </div>
    `;

    return;
  }

  box.innerHTML = family.map(function(item){

    return `
      <div class="data-item">
        <b>👤 ${escapeHTML(item.name)}</b>
        <small>Family member saved</small>
      </div>
    `;

  }).join("");
}


/* =========================
   HERO
========================= */

function updateHero(){

  const hour = new Date().getHours();

  let title = "Good Morning 👋";

  if(hour >= 12 && hour < 17){
    title = "Good Afternoon 👋";
  }

  if(hour >= 17){
    title = "Good Evening 👋";
  }

  if(hour < 5){
    title = "Good Night 🌙";
  }

  document.getElementById("heroTitle").textContent = title;

  const pending = reminders.length;

  document.getElementById("heroText").textContent =
    pending
      ? pending + " reminder pending है"
      : "आज के जरूरी काम देखें";
}


/* =========================
   MAIN RENDER
========================= */

function render(){

  try{

    document.getElementById("docCount").textContent = documents.length;
    document.getElementById("billCount").textContent = bills.length;
    document.getElementById("vehicleCount").textContent = vehicles.length;
    document.getElementById("familyCount").textContent = family.length;

    updateHero();

    const homeReminders = document.getElementById("homeReminders");

    if(!reminders.length){

      homeReminders.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⏰</div>
          अभी कोई reminder नहीं है
        </div>
      `;

    }else{

      homeReminders.innerHTML = reminders
        .slice()
        .sort(function(a,b){
          return String(a.date).localeCompare(String(b.date));
        })
        .slice(0,5)
        .map(reminderItem)
        .join("");

    }


    const allReminders = document.getElementById("allReminders");

    if(!reminders.length){

      allReminders.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⏰</div>
          अभी कोई reminder नहीं है
        </div>
      `;

    }else{

      allReminders.innerHTML = reminders
        .slice()
        .sort(function(a,b){
          return String(a.date).localeCompare(String(b.date));
        })
        .map(reminderItem)
        .join("");

    }


    renderDocuments();
    renderBills();
    renderVehicles();
    renderFamily();

  }catch(error){

    console.error("LifeOS render error:",error);

    const home = document.getElementById("homeReminders");

    if(home){
      home.innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          App loading error
        </div>
      `;
    }

  }
}


/* =========================
   START APP
========================= */

document.addEventListener("DOMContentLoaded",function(){

  try{

    const dateInput = document.getElementById("remDate");

    if(dateInput){

      const now = new Date();

      const year = now.getFullYear();

      const month = String(now.getMonth()+1).padStart(2,"0");

      const day = String(now.getDate()).padStart(2,"0");

      dateInput.value = year + "-" + month + "-" + day;
    }

    render();

  }catch(error){

    console.error("LifeOS startup error:",error);

  }

});

</script>

</body>
</html>
